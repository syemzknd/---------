<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2038年，你的手机会以为回到了1901年</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #06080f;
  }
</style>
</head>
<body>
<canvas id="canvas" width="1920" height="1080"></canvas>
<script>
(() => {
  'use strict';

  // ---------- 全局参数 ----------
  const W = 1920;
  const H = 1080;
  const FPS = 30;
  const DURATION = 45;
  const TOTAL_FRAMES = FPS * DURATION;

  window.FPS = FPS;
  window.DURATION = DURATION;
  window.TOTAL_FRAMES = TOTAL_FRAMES;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // ---------- 固定种子随机 ----------
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const seededRandom = mulberry32(20270119);

  // ---------- 缓动函数 ----------
  function easeOutCubic(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.pow(1 - t, 3);
  }
  function easeInCubic(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t * t * t;
  }
  function easeOutBack(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeInOutCubic(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function easeOutExpo(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }
  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }
  function remap(value, low1, high1, low2, high2) {
    if (high1 === low1) return low2;
    const t = clamp((value - low1) / (high1 - low1), 0, 1);
    return low2 + (high2 - low2) * t;
  }

  // ---------- 颜色工具 ----------
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) {
      hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    }
    const num = parseInt(hex, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }
  function rgba(hex, alpha) {
    const c = hexToRgb(hex);
    return `rgba(${c.r},${c.g},${c.b},${alpha})`;
  }
  function mixWithBg(hex, strength) {
    const c = hexToRgb(hex);
    const bg = hexToRgb('#06080f');
    const r = Math.round(lerp(bg.r, c.r, strength));
    const g = Math.round(lerp(bg.g, c.g, strength));
    const b = Math.round(lerp(bg.b, c.b, strength));
    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
  }

  // ---------- 绘制工具 ----------
  function drawRoundRect(ctx, x, y, w, h, r, fillStyle, strokeStyle, lineWidth) {
    ctx.save();
    ctx.beginPath();
    if (typeof r === 'number') {
      r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
    }
    ctx.closePath();
    if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
    if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth || 1; ctx.stroke(); }
    ctx.restore();
  }

  function drawText(ctx, text, x, y, opts = {}) {
    const {
      size = 48,
      color = '#ffffff',
      align = 'center',
      baseline = 'middle',
      weight = 400,
      fontFamily = 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
      maxWidth = null,
      lineHeight = null,
      glow = false,
      glowColor = '#ffffff',
      glowBlur = 14,
      alpha = 1
    } = opts;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${weight} ${size}px ${fontFamily}`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.fillStyle = color;
    if (glow) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = glowBlur;
    }
    const lines = String(text).split('\n');
    const lh = lineHeight || size * 1.25;
    lines.forEach((line, i) => {
      const yy = y + (i - (lines.length - 1) / 2) * lh;
      ctx.fillText(line, x, yy, maxWidth !== null ? maxWidth : undefined);
    });
    ctx.restore();
  }

  // ---------- 摄影机 ----------
  const camera = {
    x: 0,
    y: 0,
    z: 1
  };

  function applyCamera(ctx) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(camera.z, camera.z);
    ctx.translate(-camera.x, -camera.y);
  }
  function removeCamera(ctx) {
    ctx.restore();
  }

  // ---------- 场景元素动画控制 ----------
  function elementVisibility(start, end, time, fadeIn = 0.5, fadeOut = 0.5) {
    if (time < start || time > end) return 0;
    const fadeInAlpha = remap(time, start, start + fadeIn, 0, 1);
    const fadeOutAlpha = remap(time, end - fadeOut, end, 1, 0);
    return clamp(Math.min(fadeInAlpha, fadeOutAlpha), 0, 1);
  }

  function elementTransform(start, end, time, fadeIn = 0.5, fadeOut = 0.5) {
    const alpha = elementVisibility(start, end, time, fadeIn, fadeOut);
    const progress = remap(time, start, end, 0, 1);
    return { alpha, progress };
  }

  // ---------- 绘制单个元素 ----------
  function drawElement(ctx, element, time, frameIndex) {
    const { type, at, startTime, endTime } = element;
    const start = at ? at[0] : startTime;
    const end = at ? at[1] : endTime;
    const fadeIn = 0.5;
    const fadeOut = 0.5;

    switch (type) {
      case 'icon': {
        if (element.name === '数字时钟') {
          drawDigitalClock(ctx, element, start, end, time);
        } else if (element.name === '警告三角') {
          drawWarningTriangle(ctx, element, start, end, time);
        } else if (element.name === '起始终点标记') {
          drawTimelineMarker(ctx, element, start, end, time, '1970', '#22d3ee', -1);
        } else if (element.name === '终点标记') {
          drawTimelineMarker(ctx, element, start, end, time, '2038', '#ef4444', 1);
        } else if (element.name === '断裂裂纹') {
          drawCrack(ctx, element, start, end, time);
        } else if (element.name === '日历') {
          drawCalendar(ctx, element, start, end, time);
        } else if (element.name === '手机') {
          drawPhone(ctx, element, start, end, time);
        } else if (element.name === '银行单据') {
          drawBankReceipt(ctx, element, start, end, time);
        } else if (element.name === '导航地图') {
          drawMapIcon(ctx, element, start, end, time);
        }
        break;
      }
      case 'title': {
        drawTitle(ctx, element, start, end, time);
        break;
      }
      case 'line': {
        drawLine(ctx, element, start, end, time);
        break;
      }
      case 'counter': {
        drawCounter(ctx, element, start, end, time);
        break;
      }
      case 'grid': {
        drawGrid(ctx, element, start, end, time);
        break;
      }
      case 'digits': {
        drawDigits(ctx, element, start, end, time);
        break;
      }
      case 'text': {
        drawTextElement(ctx, element, start, end, time);
        break;
      }
      case 'highlight': {
        drawHighlight(ctx, element, start, end, time);
        break;
      }
      case 'transition': {
        drawTransition(ctx, element, start, end, time);
        break;
      }
      case 'subtitle': {
        drawSubtitle(ctx, element, start, end, time);
        break;
      }
      case 'particles': {
        drawParticles(ctx, element, start, end, time, frameIndex);
        break;
      }
      case 'caption': {
        drawCaption(ctx, element, start, end, time);
        break;
      }
      default: {
        break;
      }
    }
  }

  // ---------- 数字时钟 ----------
  function drawDigitalClock(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const shake = time < 2 ? 1 : 0;
    const jitterX = shake && time > 0.05 ? (seededRandom() - 0.5) * 22 : 0;
    const jitterY = shake && time > 0.05 ? (seededRandom() - 0.5) * 16 : 0;
    const cx = 0 + jitterX;
    const cy = -180 + jitterY;
    const w = 400;
    const h = 160;
    const radius = 18;

    ctx.save();
    ctx.globalAlpha = alpha;
    // 边缘毛刺
    ctx.shadowColor = 'rgba(255,255,255,0.35)';
    ctx.shadowBlur = 24;
    drawRoundRect(ctx, cx - w / 2, cy - h / 2, w, h, radius, '#0b1020', '#ffffff', 3);
    ctx.shadowBlur = 0;

    const numText = '2038.1.19';
    const fontSize = 68;
    const fontWeight = 700;
    const fontFamily = 'ui-monospace, Menlo, Consolas, monospace';
    ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(numText, cx, cy);
    ctx.restore();
  }

  // ---------- 警告三角 ----------
  function drawWarningTriangle(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const pulse = (Math.sin(time * Math.PI * 2 / 0.5) + 1) / 2;
    const alphaVal = alpha * lerp(0.3, 1.0, pulse);
    const cx = 780;
    const cy = -400;
    const size = 80;

    ctx.save();
    ctx.globalAlpha = alphaVal;
    ctx.fillStyle = 'rgba(239,68,68,0.4)';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx - size * 0.87, cy + size * 0.5);
    ctx.lineTo(cx + size * 0.87, cy + size * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 内部叹号
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(cx, cy + 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - 3, cy - 28, 6, 34);
    ctx.restore();
  }

  // ---------- 时间线标记 ----------
  function drawTimelineMarker(ctx, element, start, end, time, label, color, side) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const lineY = 160;
    const margin = 200;
    const x = side < 0 ? -(W / 2 - 320) : (W / 2 - 320);
    const y = lineY - 42;

    ctx.save();
    ctx.globalAlpha = alpha;
    if (side < 0) {
      // 光晕
      ctx.shadowColor = 'rgba(34,211,238,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      drawText(ctx, label, x, y + 32, { size: 30, color: '#22d3ee', weight: 600 });
    } else {
      ctx.shadowColor = 'rgba(239,68,68,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      drawText(ctx, label, x, y + 32, { size: 30, color: '#ef4444', weight: 600 });
    }
    ctx.restore();
  }

  // ---------- 断裂裂纹 ----------
  function drawCrack(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const lineY = 160;
    const rightX = W / 2 - 320;
    const cx = rightX;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(239,68,68,0.7)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(cx, lineY);
    ctx.lineTo(cx - 40, lineY - 30);
    ctx.lineTo(cx - 18, lineY - 46);
    ctx.lineTo(cx - 58, lineY - 82);
    ctx.moveTo(cx, lineY);
    ctx.lineTo(cx + 38, lineY + 24);
    ctx.lineTo(cx + 16, lineY + 42);
    ctx.lineTo(cx + 50, lineY + 76);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- 日历 ----------
  function drawCalendar(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const cx = -740;
    const cy = -390;
    const w = 140;
    const h = 120;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawRoundRect(ctx, cx - w / 2, cy - h / 2, w, h, 12, '#141c31', '#94a3b8', 3);
    // 顶部斜杠模拟翻页
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2 + 12, cy - h / 2 + 10);
    ctx.lineTo(cx + w / 2 - 12, cy - h / 2 + 26);
    ctx.moveTo(cx - w / 2 + 22, cy - h / 2 + 4);
    ctx.lineTo(cx + w / 2 - 6, cy - h / 2 + 20);
    ctx.stroke();
    // 页码数字模糊
    ctx.font = '600 28px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#94a3b8';
    ctx.filter = 'blur(1px)';
    ctx.fillText('2038', cx, cy + 16);
    ctx.filter = 'none';
    ctx.restore();
  }

  // ---------- 手机 ----------
  function drawPhone(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const cx = -450;
    const cy = 60;
    const w = 200;
    const h = 360;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawRoundRect(ctx, cx - w / 2, cy - h / 2, w, h, 32, '#0b1020', '#22d3ee', 4);
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath();
    ctx.arc(cx, cy - 80, 30, 0, Math.PI * 2);
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 4;
    ctx.stroke();
    drawText(ctx, '闹钟', cx, cy - 8, { size: 28, color: '#e8eef8', weight: 600 });
    drawText(ctx, '1901.12.13', cx, cy + 118, { size: 24, color: '#ef4444', weight: 500, fontFamily: 'ui-monospace, Menlo, Consolas, monospace' });
    ctx.restore();
  }

  // ---------- 银行单据 ----------
  function drawBankReceipt(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const cx = 0;
    const cy = 60;
    const w = 240;
    const h = 160;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawRoundRect(ctx, cx - w / 2, cy - h / 2, w, h, 8, '#ffffff', '#ffffff', 2);
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(cx - w / 2 + 30, cy - 30 + i * 18, w - 60, 3);
    }
    drawText(ctx, '1901.12.13', cx, cy + 70, { size: 28, color: '#ef4444', weight: 500, fontFamily: 'ui-monospace, Menlo, Consolas, monospace' });
    ctx.restore();
  }

  // ---------- 导航地图 ----------
  function drawMapIcon(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const cx = 450;
    const cy = 60;
    const w = 220;
    const h = 160;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawRoundRect(ctx, cx - w / 2, cy - h / 2, w, h, 8, '#141c31', '#22d3ee', 3);
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(cx - w / 2 + 20, cy - h / 2 + 20, w - 40, h - 40);
    ctx.stroke();
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy + 30);
    ctx.lineTo(cx + 40, cy - 20);
    ctx.stroke();
    drawText(ctx, '1901.12.13', cx, cy + 72, { size: 24, color: '#ef4444', weight: 500, fontFamily: 'ui-monospace, Menlo, Consolas, monospace' });
    ctx.restore();
  }

  // ---------- 标题 ----------
  function drawTitle(ctx, element, start, end, time) {
    const t = remap(time, start, start + 0.8, 0, 1);
    if (t <= 0) return;
    const alpha = t;
    const slideIn = easeOutCubic(t);
    const x = lerp(700, 0, slideIn);
    const y = 360;
    drawText(ctx, element.text, x, y, {
      size: 68,
      color: '#22d3ee',
      weight: 700,
      glow: true,
      glowColor: 'rgba(34,211,238,0.6)',
      alpha
    });
  }

  // ---------- 时间线 ----------
  function drawLine(ctx, element, start, end, time) {
    const t = remap(time, start, start + 2, 0, 1);
    if (t <= 0) return;
    const progress = easeOutCubic(t);
    const y = 160;
    const left = -(W / 2 - 120);
    const right = W / 2 - 120;
    const width = (right - left) * progress;
    ctx.save();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(left + width, y);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- 计数器 ----------
  function drawCounter(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    let displayValue = '0';
    let color = '#ffffff';
    let suffix = element.detail && element.detail.includes('秒') ? '秒' : '';
    if (element.detail && element.detail.includes('从2038开始')) {
      // 奇观场景倒计时
      const t = clamp((time - start) / (end - start), 0, 1);
      const year = Math.floor(lerp(2038, 1901, easeInOutCubic(t)));
      displayValue = String(year);
      suffix = '';
      if (time > 30) color = '#ef4444';
    } else if (element.detail && element.detail.includes('2147483647')) {
      // 冲突场景从0滚动到上限
      const scrollDuration = 4;
      const tScroll = clamp((time - start) / scrollDuration, 0, 1);
      const value = Math.floor(lerp(0, 2147483647, easeOutCubic(tScroll)));
      displayValue = String(value);
      suffix = '秒';
      if (time > start + 3.8) {
        color = '#ef4444';
      }
    } else if (element.detail && element.detail.includes('64位戳')) {
      // 落回人场景
      const tScroll = clamp((time - start) / (end - start), 0, 1);
      const value = Math.floor(lerp(1700000000, 2000000000, easeOutCubic(tScroll)));
      displayValue = String(value);
      suffix = '';
    }
    const y = element.position && element.position.includes('图标下方') ? 340
      : element.position && element.position.includes('中央') ? -40 : 140;
    const fontSize = element.size || 56;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (color === '#ef4444') {
      ctx.shadowColor = 'rgba(239,68,68,0.8)';
      ctx.shadowBlur = 24;
    }
    drawText(ctx, displayValue + suffix, 0, y, {
      size: fontSize,
      color,
      weight: 700,
      fontFamily: 'ui-monospace, Menlo, Consolas, monospace',
      glow: color === '#ef4444',
      glowColor: 'rgba(239,68,68,0.8)'
    });
    ctx.restore();
  }

  // ---------- 32方格 ----------
  function drawGrid(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const cols = 8;
    const rows = 4;
    const cellSize = 70;
    const gap = 18;
    const gridW = cols * cellSize + (cols - 1) * gap;
    const gridH = rows * cellSize + (rows - 1) * gap;
    const startX = -gridW / 2;
    const startY = -gridH / 2 + 200;
    const appearDuration = 1.8;

    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const idx = j * cols + i;
        const localStart = start + (getGridIndexOrder(idx) / (cols * rows)) * appearDuration;
        const localAlpha = elementVisibility(localStart, end, time, 0.3, 0.3);
        if (localAlpha <= 0) continue;
        const x = startX + i * (cellSize + gap);
        const y = startY + j * (cellSize + gap);
        let bit = '1';
        if (time < 17 || time >= 18) {
          if (idx === 0) bit = time < 17 ? '0' : '1';
          else bit = time < 17 ? '1' : '0';
        } else {
          const flipProgress = clamp((time - 17) / 1.2, 0, 1);
          const rotation = Math.floor(flipProgress * 2);
          const showVal = rotation % 2 === 0 ? (idx === 0 ? '0' : '1') : (idx === 0 ? '1' : '0');
          bit = showVal;
        }
        const cellColor = (idx === 0) ? '#f59e0b' : '#64748b';
        drawRoundRect(ctx, x, y, cellSize, cellSize, 8, mixWithBg(cellColor, 0.16), cellColor, 2);
        drawText(ctx, bit, x + cellSize / 2, y + cellSize / 2, {
          size: 34,
          color: '#e8eef8',
          weight: 600,
          fontFamily: 'ui-monospace, Menlo, Consolas, monospace'
        });
      }
    }
    ctx.restore();
  }

  function getGridIndexOrder(idx) {
    const order = [0,1,2,3,4,5,6,7,15,14,13,12,11,10,9,8,16,17,18,19,20,21,22,23,31,30,29,28,27,26,25,24];
    return order[idx] !== undefined ? order[idx] : idx;
  }

  // ---------- 数字文本 ----------
  function drawDigits(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const text = element.detail || '';
    const color = element.color || '#ffffff';
    const size = element.size || 64;
    const y = element.position && element.position.includes('上方') ? -120 : -40;
    let drawAlpha = alpha;
    if (element.detail && element.detail.includes('-2147483648')) {
      const t = remap(time, start, start + 0.5, 0, 1);
      drawAlpha = alpha * easeOutBack(t);
    }
    drawText(ctx, text, 0, y, {
      size,
      color,
      weight: 700,
      fontFamily: 'ui-monospace, Menlo, Consolas, monospace',
      alpha: drawAlpha
    });
  }

  // ---------- 普通文本 ----------
  function drawTextElement(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const text = element.detail || '';
    const color = element.color || '#94a3b8';
    const size = element.size || 32;
    const y = element.position && element.position.includes('下方') ? 300 : 0;
    drawText(ctx, text, 0, y, { size, color, weight: 400, alpha });
  }

  // ---------- 高亮框 ----------
  function drawHighlight(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const cols = 8;
    const rows = 4;
    const cellSize = 70;
    const gap = 18;
    const gridW = cols * cellSize + (cols - 1) * gap;
    const gridH = rows * cellSize + (rows - 1) * gap;
    const startY = -gridH / 2 + 200;
    const x = -gridW / 2;
    const y = startY;
    const blink = (Math.sin(time * Math.PI * 2) + 1) / 2;
    const highlightAlpha = alpha * lerp(0.4, 1, blink);
    ctx.save();
    ctx.globalAlpha = highlightAlpha;
    drawRoundRect(ctx, x - 10, y - 10, cellSize + 20, cellSize + 20, 10, null, '#f59e0b', 6);
    ctx.restore();
  }

  // ---------- 转场 ----------
  function drawTransition(ctx, element, start, end, time) {
    if (element.detail && element.detail.includes('方格翻转')) {
      // 翻转转场在 drawGrid 中处理
    } else if (element.detail && element.detail.includes('整体色调')) {
      const t = remap(time, 30, 32, 0, 1);
      if (t <= 0) return;
      const redPulse = easeInOutCubic(t);
      ctx.save();
      ctx.globalAlpha = redPulse * 0.6;
      ctx.fillStyle = 'rgba(239,68,68,0.15)';
      ctx.fillRect(-W / 2, -H / 2, W, H);
      ctx.shadowColor = 'rgba(239,68,68,0.8)';
      ctx.shadowBlur = 60;
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.rect(-W / 2 + 20, -H / 2 + 20, W - 40, H - 40);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------- 字幕 ----------
  function drawSubtitle(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const text = element.text || '年份';
    drawText(ctx, text, 0, 250, { size: 28, color: '#64748b', weight: 500, alpha });
  }

  // ---------- 粒子 ----------
  function drawParticles(ctx, element, start, end, time, frameIndex) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const particleCount = 40;
    const cx = 0;
    const cy = -40;
    const spread = 120;
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < particleCount; i++) {
      const seed = (i * 0.37 + Math.floor(frameIndex * 0.5)) % 1;
      const angle = (i / particleCount) * Math.PI * 2 + time * 1.2 + seed;
      const dist = spread * lerp(0.4, 1.4, ((time - start + i * 0.07) % 1.6) / 1.6);
      const px = cx + Math.cos(angle) * dist;
      const py = cy + Math.sin(angle) * dist * 0.8;
      const size = lerp(6, 2, dist / (spread * 1.2));
      ctx.fillStyle = 'rgba(239,68,68,0.8)';
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- 落回人标题 ----------
  function drawCaption(ctx, element, start, end, time) {
    const { alpha } = elementTransform(start, end, time);
    if (alpha <= 0) return;
    const text = element.text || '';
    const fadeInAlpha = remap(time, start, start + 0.8, 0, 1);
    const fadeOutAlpha = remap(time, 43.5, 45, 1, 0);
    const a = alpha * fadeInAlpha * fadeOutAlpha;
    ctx.save();
    ctx.globalAlpha = a;
    drawText(ctx, text, 0, 0, {
      size: 48,
      color: '#ffffff',
      weight: 700,
      glow: true,
      glowColor: 'rgba(255,255,255,0.6)',
      alpha: a
    });
    ctx.restore();
  }

  // ---------- 主渲染循环 ----------
  function computeCamera(frameIndex) {
    const time = frameIndex / FPS;
    camera.x = 0;
    camera.y = 0;
    camera.z = 1;
    // 简单的镜头语言：整体跟随场景微调
    if (time >= 0 && time < 4) {
      camera.z = 1;
    } else if (time >= 4 && time < 10) {
      camera.z = 1;
      camera.x = 0;
    } else if (time >= 10 && time < 22) {
      camera.z = 1;
    } else if (time >= 22 && time < 34) {
      camera.z = 1;
    } else if (time >= 34 && time < 45) {
      camera.z = 1;
    }
    // 结尾拉远
    if (time > 42) {
      const zoomOut = remap(time, 42, 45, 1, 0.95);
      camera.z = zoomOut;
    }
  }

  function drawBackground(ctx, time) {
    ctx.save();
    ctx.fillStyle = '#06080f';
    ctx.fillRect(-W / 2, -H / 2, W, H);
    // 背景微妙的网格
    ctx.strokeStyle = 'rgba(34,211,238,0.05)';
    ctx.lineWidth = 1;
    const gridStep = 100;
    for (let x = -W / 2; x <= W / 2; x += gridStep) {
      ctx.beginPath();
      ctx.moveTo(x, -H / 2);
      ctx.lineTo(x, H / 2);
      ctx.stroke();
    }
    for (let y = -H / 2; y <= H / 2; y += gridStep) {
      ctx.beginPath();
      ctx.moveTo(-W / 2, y);
      ctx.lineTo(W / 2, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawScene(ctx, frameIndex) {
    const time = frameIndex / FPS;
    drawBackground(ctx, time);

    // 场景1：hook 0-4
    drawScene1(ctx, time, frameIndex);
    // 场景2：conflict 4-10
    drawScene2(ctx, time, frameIndex);
    // 场景3：reveal 10-22
    drawScene3(ctx, time, frameIndex);
    // 场景4：spectacle 22-34
    drawScene4(ctx, time, frameIndex);
    // 场景5：fallback 34-45
    drawScene5(ctx, time, frameIndex);
  }

  function drawScene1(ctx, time, frameIndex) {
    if (time < 0 || time > 4) return;
    const clock = {
      type: 'icon', name: '数字时钟', at: [0, 4], color: '#ffffff', size: '400x160'
    };
    const warning = {
      type: 'icon', name: '警告三角', at: [0.5, 4], color: '#ef4444', size: '80x70'
    };
    const title = {
      type: 'title', text: '你的时间，会倒着走', at: [1, 4], color: '#22d3ee', size: 68
    };
    drawElement(ctx, clock, time, frameIndex);
    drawElement(ctx, warning, time, frameIndex);
    drawElement(ctx, title, time, frameIndex);
  }

  function drawScene2(ctx, time, frameIndex) {
    if (time < 4 || time > 10) return;
    const line = {
      type: 'line', at: [4, 10], color: '#334155', size: '1600x4'
    };
    const startMarker = {
      type: 'icon', name: '起始终点标记', at: [4.5, 10], color: '#22d3ee', size: '60x40'
    };
    const endMarker = {
      type: 'icon', name: '终点标记', at: [4.5, 10], color: '#ef4444', size: '60x40'
    };
    const counter = {
      type: 'counter', at: [4.5, 10], color: '#ffffff', size: 56,
      detail: '从0滚动到2147483647，数字右侧带秒字'
    };
    const crack = {
      type: 'icon', name: '断裂裂纹', at: [8.5, 10], color: '#ef4444', size: '120x40'
    };
    drawElement(ctx, line, time, frameIndex);
    drawElement(ctx, startMarker, time, frameIndex);
    drawElement(ctx, endMarker, time, frameIndex);
    drawElement(ctx, counter, time, frameIndex);
    drawElement(ctx, crack, time, frameIndex);
  }

  function drawScene3(ctx, time, frameIndex) {
    if (time < 10 || time > 22) return;
    const grid = {
      type: 'grid', at: [10, 18], color: '#64748b', size: '960x90'
    };
    const digitsUp = {
      type: 'digits', at: [10, 18], color: '#ffffff', size: 64,
      detail: '2147483647'
    };
    const textBelow1 = {
      type: 'text', at: [10, 12], color: '#94a3b8', size: 32,
      detail: '32位有符号整数，最高位是符号位'
    };
    const highlight = {
      type: 'highlight', at: [14, 18], color: '#f59e0b', size: '100x70'
    };
    const transitionFlip = {
      type: 'transition', at: [17, 18], detail: '全部32个方格同时翻转'
    };
    const digitsNeg = {
      type: 'digits', at: [18, 22], color: '#ef4444', size: 64,
      detail: '-2147483648'
    };
    const textBelow2 = {
      type: 'text', at: [18, 22], color: '#ef4444', size: 32,
      detail: '正数变负数，时间开始倒着走'
    };
    drawElement(ctx, grid, time, frameIndex);
    drawElement(ctx, digitsUp, time, frameIndex);
    drawElement(ctx, textBelow1, time, frameIndex);
    drawElement(ctx, highlight, time, frameIndex);
    drawElement(ctx, transitionFlip, time, frameIndex);
    drawElement(ctx, digitsNeg, time, frameIndex);
    drawElement(ctx, textBelow2, time, frameIndex);
  }

  function drawScene4(ctx, time, frameIndex) {
    if (time < 22 || time > 34) return;
    const calendar = {
      type: 'icon', name: '日历', at: [22, 25], color: '#94a3b8', size: '140x120'
    };
    const counter = {
      type: 'counter', at: [22, 32], color: '#ffffff', size: 120,
      detail: '从2038开始，经过1999、1987、1970等关键年份，到32秒到达1901'
    };
    const subtitle = {
      type: 'subtitle', text: '年份', at: [22, 32], color: '#64748b', size: 28
    };
    const particles = {
      type: 'particles', at: [27, 34], color: '#ef4444', size: '200x200'
    };
    const transitionRed = {
      type: 'transition', at: [30, 32], detail: '整体色调向红色偏移'
    };
    drawElement(ctx, calendar, time, frameIndex);
    drawElement(ctx, counter, time, frameIndex);
    drawElement(ctx, subtitle, time, frameIndex);
    drawElement(ctx, particles, time, frameIndex);
    drawElement(ctx, transitionRed, time, frameIndex);
  }

  function drawScene5(ctx, time, frameIndex) {
    if (time < 34 || time > 45) return;
    const phone = {
      type: 'icon', name: '手机', at: [34, 42], color: '#22d3ee', size: '200x360'
    };
    const receipt = {
      type: 'icon', name: '银行单据', at: [34.5, 42], color: '#94a3b8', size: '240x160'
    };
    const mapIcon = {
      type: 'icon', name: '导航地图', at: [35, 42], color: '#22d3ee', size: '220x160'
    };
    const counter64 = {
      type: 'counter', at: [38, 43], color: '#22d3ee', size: 64,
      position: '三个图标下方', detail: '64位戳标签和递增数字'
    };
    const caption = {
      type: 'caption', text: '换个64位，时间就正常了', at: [42, 45], color: '#ffffff', size: 48
    };
    drawElement(ctx, phone, time, frameIndex);
    drawElement(ctx, receipt, time, frameIndex);
    drawElement(ctx, mapIcon, time, frameIndex);
    drawElement(ctx, counter64, time, frameIndex);
    drawElement(ctx, caption, time, frameIndex);
  }

  // ---------- 渲染帧 ----------
  function renderFrame(frameIndex) {
    frameIndex = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.floor(frameIndex)));
    ctx.clearRect(0, 0, W, H);
    computeCamera(frameIndex);
    applyCamera(ctx);
    drawScene(ctx, frameIndex);
    removeCamera(ctx);
  }

  window.renderFrame = renderFrame;

  // ---------- 运行模式 ----------
  function isScreenshotMode() {
    const params = new URLSearchParams(window.location.search);
    return params.has('frame');
  }

  function getFrameFromURL() {
    const params = new URLSearchParams(window.location.search);
    const frame = parseInt(params.get('frame'), 10);
    return isNaN(frame) ? 0 : frame;
  }

  function startPreview() {
    let frame = 0;
    function loop() {
      renderFrame(frame);
      frame = (frame + 1) % TOTAL_FRAMES;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  function startScreenshot() {
    const frame = getFrameFromURL();
    renderFrame(frame);
    window.__RENDER_DONE__ = true;
  }

  if (isScreenshotMode()) {
    startScreenshot();
  } else {
    startPreview();
  }
})();
</script>
